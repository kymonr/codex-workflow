name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: codex-workflow --help
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m compileall -q workflow tests
      - run: python -m pip check
      - run: python -m pip wheel --no-deps . --wheel-dir "${{ runner.temp }}/wheelhouse"
      - name: Mock smoke tests
        run: |
          python -m workflow run examples/hello.js --mock --timeout-seconds 30 --runs-root "${{ runner.temp }}/workflow-runs"
          python -m workflow run examples/parallel-hello.js --mock --timeout-seconds 30 --runs-root "${{ runner.temp }}/workflow-runs"
          python -m workflow run examples/nested-parent.js --mock --args-file examples/nested-args.json --timeout-seconds 30 --runs-root "${{ runner.temp }}/workflow-runs"
